services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hana
      POSTGRES_USER: hana
      POSTGRES_PASSWORD: hana_local_dev
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - hana_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hana -d hana']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hana_postgres:
